; Asterisk Dialplan 配置示例
; 用于实时接收SMS并推送给Telegram Bot

[globals]
; 定义SMS管道路径
SMS_PIPE=/tmp/asterisk_sms_pipe

; SMS接收上下文
[incoming-sms]
exten => sms,1,NoOp(Incoming SMS)
same => n,AGI(sms_ingress_agi.py)
same => n,Hangup()

[general-sms]
exten => _X.,1,Goto(incoming-sms,sms,1)

[quectel-sms]
exten => sms,1,Goto(incoming-sms,sms,1)

; 测试SMS发送
[test-sms]
exten => _X.,1,NoOp(测试SMS发送)
exten => _X.,n,QuectelSendSMS(${ARG1},${ARG2},${ARG3})
exten => _X.,n,Hangup()
