; Asterisk Dialplan 配置示例
; 用于实时接收SMS并推送给Telegram Bot

[globals]
; 定义SMS管道路径
SMS_PIPE=/tmp/asterisk_sms_pipe

; SMS接收上下文
[incoming-sms]
; 当收到SMS时触发
exten => _X.,1,NoOp(收到SMS: ${SMS_FROM} -> ${SMS_TO}: ${SMS_BODY})
exten => _X.,n,Set(SMS_DEVICE=${CHANNEL})
exten => _X.,n,Set(SMS_TIMESTAMP=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
exten => _X.,n,Set(SMS_JSON={"device_id":"${SMS_DEVICE}","sender_number":"${SMS_FROM}","content":"${SMS_BODY}","timestamp":"${SMS_TIMESTAMP}"})
exten => _X.,n,System(echo '${SMS_JSON}' > ${SMS_PIPE})
exten => _X.,n,Hangup()

; 通用SMS处理
[general-sms]
; 处理所有SMS消息
exten => _X.,1,NoOp(处理SMS消息)
exten => _X.,n,Goto(incoming-sms,${EXTEN},1)

; Quectel设备SMS处理
[quectel-sms]
; 专门处理Quectel设备的SMS
exten => _X.,1,NoOp(Quectel SMS: ${SMS_FROM} -> ${SMS_TO})
exten => _X.,n,Set(DEVICE_ID=${CHANNEL:0:8})
exten => _X.,n,Set(SMS_TIMESTAMP=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
exten => _X.,n,Set(SMS_JSON={"device_id":"${DEVICE_ID}","sender_number":"${SMS_FROM}","content":"${SMS_BODY}","timestamp":"${SMS_TIMESTAMP}"})
exten => _X.,n,System(echo '${SMS_JSON}' > ${SMS_PIPE})
exten => _X.,n,Hangup()

; 测试SMS发送
[test-sms]
exten => _X.,1,NoOp(测试SMS发送)
exten => _X.,n,QuectelSendSMS(${ARG1},${ARG2},${ARG3})
exten => _X.,n,Hangup()
