; ===========================================
; Asterisk Dialplan 配置
; 集成3CX、SMS推送、USSD处理
; ===========================================

[globals]
; 定义路径
SMS_PIPE=/var/lib/asterisk-telegram-bot/asterisk_sms_pipe
;SMS_LOG=/var/log/asterisk/sms.txt
;USSD_LOG=/var/log/asterisk/ussd.txt

; ===========================================
; 3CX 呼入处理
; ===========================================
[from-3cx]
exten => _.,1,NoOp(Incoming call from 3CX)
same => n,MixMonitor(${CALLERID(num)}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav)
same => n,Dial(Quectel/i:<QUECTEL_IMEI>/${EXTEN})
same => n,Hangup()

; ===========================================
; Quectel设备入站处理（语音和SMS）
; ===========================================
[incoming-mobile]
exten => h,1,NoOp(Hangup cleanup)
same => n,Hangup()

; 呼出到3CX
exten => _.,1,NoOp(Outgoing call to 3CX)
; 调试信息
same => n,Verbose(1, "Original CALLERID: ${CALLERID(all)}")
same => n,Verbose(1, "Channel: ${CHANNEL}")
; 设置呼叫方ID
same => n,Set(CALLERID(num)=${CALLERID(num)})
same => n,Set(CALLERID(name)=${CALLERID(num)})
same => n,Set(CALLERIDPRES=allowed_passed_screen)
; 验证设置
same => n,Verbose(1, "New CALLERID: ${CALLERID(all)}")
; 拨号
same => n,Dial(PJSIP/${EXTEN}@10002)
same => n,Hangup()

; SMS处理（集成Bot推送）
exten => sms,1,NoOp(Incoming SMS)
same => n,AGI(sms_ingress_agi.py)
same => n,Hangup()

; ===========================================
; USSD 处理
; ===========================================
exten => ussd,1,Verbose(Incoming USSD: ${BASE64_DECODE(${USSD_BASE64})})
;same => n,System(echo '${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)} - ${JSON_DECODE(QUECTEL,name)}: ${JSON_DECODE(USSD,ussd)}' >> ${USSD_LOG})
same => n,Hangup()

; ===========================================
; 通用SMS处理（备用）
; ===========================================
[general-sms]
exten => _X.,1,NoOp(处理SMS消息)
same => n,Goto(incoming-mobile,sms,1)

; ===========================================
; 测试SMS发送
; ===========================================
[test-sms]
exten => _X.,1,NoOp(测试SMS发送)
same => n,QuectelSendSMS(${ARG1},${ARG2},${ARG3})
same => n,Hangup()
